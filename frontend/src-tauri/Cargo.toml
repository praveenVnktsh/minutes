[package]
name = "meetily"
version = "1.5.3"
description = "A Tauri App for meeting minutes"
authors = ["Meetily contributors"]
license = "MIT"
repository = "https://github.com/praveenvnktsh/minutes"
edition = "2021"
rust-version = "1.91"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]


# Minutes is a macOS (Apple Silicon) app. whisper-rs always builds with Metal
# and CoreML (see [dependencies]); these features exist for the build scripts
# that pass them explicitly.
[features]
default = []
metal = ["whisper-rs/metal"]       # Apple Metal GPU (always on via the whisper-rs dependency)
coreml = ["whisper-rs/coreml"]     # Apple CoreML acceleration
openmp = ["whisper-rs/openmp"]     # OpenMP parallel processing

# Developer tool: the pipeline replay harness (examples/replay.rs), which runs
# the app headless on Tauri's mock runtime. Never part of a release build.
dev-replay = ["tauri/test"]

[[example]]
name = "replay"
required-features = ["dev-replay"]

[build-dependencies]
tauri-build = { version = "2.3.0", features = [] }
reqwest = { version = "0.11", features = ["blocking", "multipart", "json", "stream"] }
zip = "2.2"           # ZIP extraction (FFmpeg sidecar download)


[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
anyhow = "1.0"
once_cell = "1.17.1"
uuid = { version = "1.0", features = ["v4", "serde"] }
posthog-rs = "0.3.7"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"

# Microphone capture
cpal = "0.15.3"

# Wav encoding - now using manual WAV creation instead of hound
# hound = "3.5"

# Cli ! shouldn't be required if using as lib
clap = { version = "4.3", features = ["derive"] }

# Dates
chrono = { version = "0.4.31", features = ["serde"] }

# Log
log = "0.4"
env_logger = "0.11"
tracing = "0.1.40"
which = "6.0.1"

# Bytes
bytemuck = "1.16.1"

# EBU R128 loudness normalization (professional broadcast standard)
ebur128 = "0.1"

# Noise suppression - RNNoise-based neural network noise reduction
nnnoiseless = "0.5"

# Acoustic echo cancellation for the live mic transcription path.
# Pure-Rust port of WebRTC AEC3, so it adds no C++ build step. Needs Rust 1.91.
sonora = { version = "0.2", default-features = false }

# Speech recognition and async utilities
# Metal GPU + CoreML acceleration for whisper.cpp on Apple Silicon.
whisper-rs = { version = "0.13.2", features = ["raw-api", "metal", "coreml"] }
futures-util = "0.3"
silero_rs = { git = "https://github.com/emotechlab/silero-rs", rev = "26a6460", package = "silero" }

# Parakeet (ONNX-based fast transcription) dependencies
ort = { version = "2.0.0-rc.10" }  # ONNX Runtime for Parakeet models
thiserror = "2.0.16"                # Error handling for Parakeet

# Async
tokio = { version = "1.32.0", features = ["full", "tracing"] }
tokio-util = "0.7"  # Utilities for tokio including CancellationToken
async-trait = "0.1"  # Trait abstraction for async methods

reqwest = { version = "0.11", features = ["blocking", "multipart", "json", "stream"] }

# crossbeam
crossbeam = "0.8.4"
dashmap = "6.1.0"

# Directories
dirs = "5.0.1"

# Additional dependencies for notification system
url = "2.5.0"

# Calendar subscription (ICS/iCal) integration
# Pinned: 0.17.13 provides Calendar::calendar_events + CalendarEvent recurrence.
icalendar = { version = "0.17.13", features = ["parser", "recurrence"] }
rrule = "0.14"
chrono-tz = "0.10"


# System monitoring for resource management
sysinfo = "0.32"

lazy_static = { version = "1.4.0" }
realfft = "3.4.0"
regex = "1.11.0"
ndarray = "0.16"
bytes = { version = "1.9.0", features = ["serde"] }

esaxx-rs = "0.1.10"
symphonia = { version = "0.5.4", features = ["aac", "isomp4", "mp3", "flac", "ogg", "vorbis", "pcm", "wav", "opt-simd"] }
rand = "0.8.5"
rayon = "1.10"
rubato = "0.15.0"
ringbuf = "0.4.8"
tempfile = "3.3.0"
whatlang = "0.16.4"

ffmpeg-sidecar = { git = "https://github.com/nathanbabcock/ffmpeg-sidecar", branch = "main" }

sqlx = { version = "0.8", features = [ "runtime-tokio", "sqlite", "chrono"] }

# Common Tauri configuration
tauri = { version = "2.6.2", features = [ "macos-private-api", "protocol-asset", "tray-icon"] }
tauri-plugin-fs = "2.4.0"
tauri-plugin-dialog = "2.3.0"
tauri-plugin-store = "2.4.0"
tauri-plugin-notification = "2.3.1"
tauri-plugin-updater = "2.3.0"
tauri-plugin-process = "2.3.0"
tauri-plugin-global-shortcut = "2"
tauri-plugin-deep-link = "2"

tauri-plugin-single-instance = "=2.3.7"
tauri-plugin-log = { version = "2.6.0", features = ["colored"] }

# macOS system integration
objc = "0.2.7"
time = { version = "0.3", features = ["formatting"] }
core-graphics = "0.23"
cidre = { git = "https://github.com/yury/cidre", rev = "a9587fa", features = ["av"] }
dasp = "0.11.0"
futures-channel = "0.3.31"
sherpa-onnx = "1.13.8"
bzip2 = "0.4"
tar = "0.4"

[dev-dependencies]
tempfile = "3.3.0"
infer = "0.15"
criterion = { version = "0.5.1", features = ["async_tokio"] }
memory-stats = "1.0"
strsim = "0.10.0"
futures = "0.3.31"
tracing-subscriber = "0.3.16"

[patch.crates-io]
cpal = { git = "https://github.com/RustAudio/cpal", rev = "51c3b43" }
esaxx-rs = { git = "https://github.com/thewh1teagle/esaxx-rs.git", branch = "feat/dynamic-msvc-link" }
