[package]
name = "meetily"
version = "1.5.3"
description = "A Tauri App for meeting minutes"
authors = ["Meetily contributors"]
license = "MIT"
repository = "https://github.com/praveenvnktsh/minutes"
edition = "2021"
rust-version = "1.91"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]


# Minutes is a macOS (Apple Silicon) app. Every speech model runs on Core ML
# through FluidAudio in the speech-helper sidecar (speech-helper/ at the repo
# root), so this crate has no GPU or ONNX features of its own.
[features]
default = []

# Developer tool: the pipeline replay harness (examples/replay.rs), which runs
# the app headless on Tauri's mock runtime. Never part of a release build.
dev-replay = ["tauri/test"]

[[example]]
name = "replay"
required-features = ["dev-replay"]

[build-dependencies]
tauri-build = { version = "2.3.0", features = [] }
reqwest = { version = "0.11", features = ["blocking", "multipart", "json", "stream"] }
zip = "2.2"           # ZIP extraction (FFmpeg sidecar download)


[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
anyhow = "1.0"
once_cell = "1.17.1"
uuid = { version = "1.0", features = ["v4", "serde"] }
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"

# Microphone capture
cpal = "0.15.3"

# Dates
chrono = { version = "0.4.31", features = ["serde"] }

# Log
log = "0.4"
env_logger = "0.11"
tracing = "0.1.40"
which = "6.0.1"

# Bytes
bytemuck = "1.16.1"

# EBU R128 loudness normalization (professional broadcast standard)
ebur128 = "0.1"

# Acoustic echo cancellation for the live mic transcription path.
# Pure-Rust port of WebRTC AEC3, so it adds no C++ build step. Needs Rust 1.91.
sonora = { version = "0.2", default-features = false }

# Async utilities and error types
futures-util = "0.3"
thiserror = "2.0.16"

# Async
tokio = { version = "1.32.0", features = ["full", "tracing"] }
tokio-util = "0.7"  # Utilities for tokio including CancellationToken
async-trait = "0.1"  # Trait abstraction for async methods

reqwest = { version = "0.11", features = ["blocking", "multipart", "json", "stream"] }

# crossbeam
crossbeam = "0.8.4"

# Directories
dirs = "5.0.1"

# Additional dependencies for notification system
url = "2.5.0"

# Calendar subscription (ICS/iCal) integration
# Pinned: 0.17.13 provides Calendar::calendar_events + CalendarEvent recurrence.
icalendar = { version = "0.17.13", features = ["parser", "recurrence"] }
rrule = "0.14"


# System monitoring for resource management
sysinfo = "0.32"

lazy_static = { version = "1.4.0" }
realfft = "3.4.0"
regex = "1.11.0"
bytes = { version = "1.9.0", features = ["serde"] }
symphonia = { version = "0.5.4", features = ["aac", "isomp4", "mp3", "flac", "ogg", "vorbis", "pcm", "wav", "opt-simd"] }
rayon = "1.10"
rubato = "0.15.0"
ringbuf = "0.4.8"
tempfile = "3.3.0"
whatlang = "0.16.4"

ffmpeg-sidecar = { git = "https://github.com/nathanbabcock/ffmpeg-sidecar", branch = "main" }

sqlx = { version = "0.8", features = [ "runtime-tokio", "sqlite", "chrono"] }

# Common Tauri configuration
tauri = { version = "2.6.2", features = [ "macos-private-api", "protocol-asset", "tray-icon"] }
tauri-plugin-fs = "2.4.0"
tauri-plugin-dialog = "2.3.0"
tauri-plugin-store = "2.4.0"
tauri-plugin-notification = "2.3.1"
tauri-plugin-updater = "2.3.0"
tauri-plugin-process = "2.3.0"
tauri-plugin-global-shortcut = "2"
tauri-plugin-deep-link = "2"

tauri-plugin-single-instance = "=2.3.7"
tauri-plugin-log = { version = "2.6.0", features = ["colored"] }

# macOS system integration
objc = "0.2.7"
libc = "0.2"           # pthread QoS for quiet post-meeting work
time = { version = "0.3", features = ["formatting"] }
cidre = { git = "https://github.com/yury/cidre", rev = "a9587fa", features = ["av"] }
futures-channel = "0.3.31"

[dev-dependencies]
clap = { version = "4.3", features = ["derive"] }  # examples/replay.rs CLI
tempfile = "3.3.0"

[patch.crates-io]
cpal = { git = "https://github.com/RustAudio/cpal", rev = "51c3b43" }
