name: "Promote Stable"

# Runs daily: takes the newest canary build, publishes it as a stable
# (non-prerelease) release under the same vX.Y.Z tag, then records that version
# in tauri.conf.json. The version itself comes from the canary build (commit
# count), so it is already monotonic; this job only promotes and records it.
on:
  schedule:
    - cron: "0 9 * * *" # 09:00 UTC daily
  workflow_dispatch:

concurrency:
  group: promote-stable
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download canary release
        id: canary
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          workdir="$RUNNER_TEMP/canary"
          mkdir -p "$workdir"
          if ! gh release download canary -R "${{ github.repository }}" -D "$workdir" 2>/dev/null; then
            echo "No canary release available yet; skipping promotion."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ ! -f "$workdir/latest.json" ]; then
            echo "Canary release has no latest.json yet; skipping promotion."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          VERSION="$(jq -r '.version' "$workdir/latest.json")"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Unexpected canary version '$VERSION'; refusing to promote."
            exit 1
          fi
          # A canary whose macOS build failed still carries a Windows-only
          # manifest. Promoting it would mark a release "Latest" that macOS
          # clients can never install.
          for platform in darwin-aarch64 windows-x86_64; do
            if ! jq -e --arg p "$platform" '.platforms | has($p)' "$workdir/latest.json" >/dev/null; then
              echo "Canary $VERSION has no $platform build; refusing to promote."
              exit 1
            fi
          done
          echo "Canary version: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "workdir=$workdir" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Stop if this stable version already exists
        id: guard
        if: steps.canary.outputs.skip == 'false'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.canary.outputs.version }}"
          if gh release view "v${VERSION}" -R "${{ github.repository }}" >/dev/null 2>&1 \
            || git tag -l "v${VERSION}" | grep -q .; then
            echo "Release v${VERSION} already exists; nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Rewrite updater manifest for the stable tag
        if: steps.canary.outputs.skip == 'false' && steps.guard.outputs.skip == 'false'
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.canary.outputs.version }}"
          workdir="${{ steps.canary.outputs.workdir }}"
          tmp="$(mktemp)"
          jq --arg tag "v${VERSION}" '
            .pub_date = (now | todate)
            | .platforms = ((.platforms // {}) | with_entries(
                .value.url = (.value.url | sub("/download/canary/"; "/download/" + $tag + "/"))
              ))
          ' "$workdir/latest.json" > "$tmp"
          mv "$tmp" "$workdir/latest.json"
          echo "Rewrote latest.json:" && cat "$workdir/latest.json"

      - name: Publish stable release
        if: steps.canary.outputs.skip == 'false' && steps.guard.outputs.skip == 'false'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.canary.outputs.version }}"
          workdir="${{ steps.canary.outputs.workdir }}"

          mapfile -t files < <(find "$workdir" -maxdepth 1 -type f)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No files to upload; failing."
            exit 1
          fi

          gh release create "v${VERSION}" -R "${{ github.repository }}" \
            --title "Minutes v${VERSION}" \
            --notes "Promoted from the canary channel." \
            "${files[@]}"

          echo "Published stable release v${VERSION} with ${#files[@]} assets."

      - name: Record the released version
        if: steps.canary.outputs.skip == 'false' && steps.guard.outputs.skip == 'false'
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.canary.outputs.version }}"
          tmp="$(mktemp)"
          jq --arg v "$VERSION" '.version = $v' frontend/src-tauri/tauri.conf.json > "$tmp"
          mv "$tmp" frontend/src-tauri/tauri.conf.json

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src-tauri/tauri.conf.json
          git commit -m "chore: record released version ${VERSION} [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME:-main}"
          git push origin "HEAD:${GITHUB_REF_NAME:-main}"
