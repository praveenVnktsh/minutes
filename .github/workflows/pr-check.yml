name: "PR Check"

# The check every pull request to main must pass before it can merge.
#
# Every other workflow here is manual, scheduled, or runs on push to main --
# and Canary Release, the one that runs automatically, runs AFTER a merge and
# ships it: every merge to main auto-updates canary installs. So this is the
# only thing standing between a pull request and a release.
#
# ONE JOB, on purpose. The Rust app embeds the built frontend at compile time
# (tauri.conf.json's frontendDist is ../out), so the Rust tests cannot compile
# until the frontend is built -- which makes splitting them buy nothing but a
# second required check name. The ruleset requires this job by its name, and
# so does anything else that reads it, so do not rename it casually.
#
# The sequence itself is scripts/pr-check.sh; this file only provisions the
# runner for it (toolchains and caches).

on:
  pull_request:
    branches: [main, integration/ux-consolidation]
  # Also on every push to main, so main itself always has a verdict. foreman
  # reads the newest PR Check run on main before it dispatches or merges, and
  # a check that only runs on pull requests leaves it nothing to read.
  push:
    branches: [main, integration/ux-consolidation]
  workflow_dispatch:

concurrency:
  group: pr-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pr-check:
    name: PR Check
    # Minutes is Mac-only (Apple Silicon); the Rust crate refuses to compile
    # for any other target, so the check runs on an Apple Silicon runner.
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # --- toolchains ---------------------------------------------------------

      # Same pnpm and node as build.yml, so a check that passes here does not
      # fail in the release on a toolchain difference.
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      # `pnpm test` runs scripts/test-each.mjs, which runs each test file in its
      # own `bun test` process. See that file for why.
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      # whisper.cpp and llama.cpp dominate a cold build. Caching target/ is
      # what keeps this cheap enough to run on every pull request.
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      # The whole verification sequence lives in scripts/pr-check.sh, so this
      # job and foreman's board.toml [test] command run exactly the same thing.
      - name: PR Check
        run: bash scripts/pr-check.sh
