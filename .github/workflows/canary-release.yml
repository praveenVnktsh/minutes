name: "Canary Release"

# Every merge to main publishes a canary build to the rolling `canary`
# release. The app's updater endpoint points at
# releases/download/canary/latest.json, so canary builds auto-update
# immediately. A daily job promotes the newest canary to a stable release.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Only the newest commit matters; cancel superseded canary builds.
concurrency:
  group: canary-release
  cancel-in-progress: true

jobs:
  prepare:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      release-id: ${{ steps.release.outputs.result }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute canary version
        id: version
        shell: bash
        run: |
          BASE=$(grep -o '"version": "[^"]*"' frontend/src-tauri/tauri.conf.json | cut -d'"' -f4)
          MAJOR=$(echo "$BASE" | cut -d. -f1)
          MINOR=$(echo "$BASE" | cut -d. -f2)
          # Tauri, Apple, and the MSI bundler all require a plain numeric X.Y.Z
          # version, so the third component is a monotonic build counter (the
          # commit count) rather than a prerelease suffix. The canary channel is
          # marked by the GitHub prerelease flag on the release, not the version.
          BUILD=$(git rev-list --count HEAD)
          VERSION="${MAJOR}.${MINOR}.${BUILD}"
          echo "Base ${BASE} -> canary ${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Reset rolling canary release
        id: release
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const tag = 'canary';
            const version = '${{ steps.version.outputs.version }}';
            const body = [
              `Rolling canary build for \`${context.sha.slice(0, 7)}\`.`,
              '',
              `Version: \`${version}\``,
              '',
              'This release is overwritten on every merge to `main`. Stable releases are tagged `vX.Y.Z`.',
            ].join('\n');

            const releases = await github.paginate(github.rest.repos.listReleases, {
              owner, repo, per_page: 100
            });
            const existing = releases.find(release => release.tag_name === tag);

            if (existing) {
              const assets = await github.paginate(github.rest.repos.listReleaseAssets, {
                owner, repo, release_id: existing.id, per_page: 100
              });
              for (const asset of assets) {
                await github.rest.repos.deleteReleaseAsset({ owner, repo, asset_id: asset.id });
              }
              await github.rest.repos.updateRelease({
                owner, repo, release_id: existing.id,
                name: 'Minutes canary', prerelease: true, draft: false, body
              });
              console.log(`Reset canary release ${existing.id}, cleared ${assets.length} old assets`);
              return existing.id;
            }

            const { data } = await github.rest.repos.createRelease({
              owner, repo, tag_name: tag, name: 'Minutes canary',
              draft: false, prerelease: true, body
            });
            console.log(`Created canary release ${data.id}`);
            return data.id;

  build-all-platforms:
    needs: prepare
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # macos-latest is an arm64 runner and macos-13 (the last Intel image)
          # is retired, so the x86_64 bundle is cross-built here too.
          - platform: "macos-latest"
            args: "--target aarch64-apple-darwin"
            target: "aarch64-apple-darwin"
          - platform: "macos-latest"
            args: "--target x86_64-apple-darwin"
            target: "x86_64-apple-darwin"
          - platform: "windows-latest"
            args: ""
            target: "x86_64-pc-windows-msvc"
    uses: ./.github/workflows/build.yml
    with:
      platform: ${{ matrix.platform }}
      target: ${{ matrix.target }}
      build-args: ${{ matrix.args }}
      sign-binaries: false
      asset-prefix: "minutes"
      upload-artifacts: false
      release-id: ${{ needs.prepare.outputs.release-id }}
      release-tag: "canary"
      release-name: "Minutes canary"
      release-prerelease: "true"
      build-version: ${{ needs.prepare.outputs.version }}
    secrets: inherit

  alias-assets:
    needs: [prepare, build-all-platforms]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Stable file names so the download table never points at a version that
      # has already been overwritten by the next canary.
      - name: Add stable-named aliases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          REPO="${{ github.repository }}"
          workdir="$(mktemp -d)"

          gh release download canary -R "$REPO" -D "$workdir" \
            -p "*_aarch64.dmg" -p "*_x64.dmg" -p "*_x64-setup.exe" -p "*_x64_*-US.msi" || true

          upload=()
          dmg="$(ls "$workdir"/*_aarch64.dmg 2>/dev/null | head -1 || true)"
          if [ -n "$dmg" ]; then
            cp "$dmg" "$workdir/minutes-macos-arm64.dmg"
            upload+=("$workdir/minutes-macos-arm64.dmg")
          fi
          dmgx64="$(ls "$workdir"/*_x64.dmg 2>/dev/null | head -1 || true)"
          if [ -n "$dmgx64" ]; then
            cp "$dmgx64" "$workdir/minutes-macos-x64.dmg"
            upload+=("$workdir/minutes-macos-x64.dmg")
          fi
          exe="$(ls "$workdir"/*_x64-setup.exe 2>/dev/null | head -1 || true)"
          if [ -n "$exe" ]; then
            cp "$exe" "$workdir/minutes-windows-x64-setup.exe"
            upload+=("$workdir/minutes-windows-x64-setup.exe")
          fi
          msi="$(ls "$workdir"/*_x64_*-US.msi 2>/dev/null | head -1 || true)"
          if [ -n "$msi" ]; then
            cp "$msi" "$workdir/minutes-windows-x64.msi"
            upload+=("$workdir/minutes-windows-x64.msi")
          fi

          if [ ${#upload[@]} -gt 0 ]; then
            gh release upload canary "${upload[@]}" -R "$REPO" --clobber
            for file in "${upload[@]}"; do
              echo "Aliased $(basename "$file")"
            done
          else
            echo "No bundles found to alias"
          fi
